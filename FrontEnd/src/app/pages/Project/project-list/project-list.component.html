<div class="container-lg mt-5">

    <button (click)="addItem()" >
      + Add project
    </button>
  <h2 class="mb-4">Project List</h2>

  <div *ngIf="projectItems.length === 0" class="alert alert-info">
    No projects available
  </div>

  <div *ngIf="projectItems.length > 0">

    <table class="table table-bordered align-middle list">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>Actions</th>
         
          <th></th>
        </tr>
      </thead>

      <tbody>
    <tr *ngFor="let project of projectItems | paginate: {
          itemsPerPage: size,
          currentPage: page,
          totalItems: count
      }">
          <td>{{project.name}}</td>

          <td>{{project.description}}</td>

<td>
            <button (click)="editItem(project.id)" class="btn btn-primary">Edit</button>
            <button (click)="deleteItem(project.id)" class="btn btn-danger">Delete</button>
          </td>
        

        </tr>
      </tbody>
    </table>

  </div>
<pagination-controls
    (pageChange)="page = $event">
</pagination-controls>
</div>
